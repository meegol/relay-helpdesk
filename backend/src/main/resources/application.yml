spring:
  application:
    name: helpdesk
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/helpdesk;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    ttl-hours: 12
  storage:
    dir: ${UPLOAD_DIR:./uploads}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*],http://10.*.*.*:[*]}
  seed: ${SEED_DEMO_DATA:true}
